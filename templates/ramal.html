{% extends "parciais/base.html" %}

{% block content %}

{% load static %}

<section>
    <div class="container w-auto lista">
        <p>RAMAL</p>
    </div>
</section>

<section class="container w-auto bgcolor_cad">

    <form
        action="{% url 'submit_edicao' %}"
        method="POST"
    >
        {% csrf_token %}

        <input
            type="hidden"
            name="id_ramal"
            value="{{ ramais.id }}"
        >

        <div class="form-row">

            <div class="form-group col-md-4">
                <label for="ramal">Ramal:</label>

                <input
                    type="number"
                    id="ramal"
                    name="ramal"
                    class="form-control"
                    value="{{ ramais.ramal }}"
                    required
                >
            </div>

            <div class="form-group col-md-4">
                <label for="responsavel">Responsável:</label>

                <input
                    type="text"
                    id="responsavel"
                    name="responsavel"
                    class="form-control"
                    value="{{ ramais.nome_resp }}"
                    required
                >
            </div>

        </div>

        <div class="form-row">

            <div class="form-group col-md-4">
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    value="{{ ramais.email }}"
                    required
                >
            </div>

            <div class="form-group col-md-4">

                <label for="setor">Setor:</label>

                <select
                    id="setor"
                    name="setor"
                    class="form-control"
                    required
                >

                    <option value="">
                        Selecione o setor
                    </option>

                    {% for s in setores %}

                        <option
                            value="{{ s.id }}"
                            {% if s.id == ramais.setor_ramais_id %}selected{% endif %}
                        >
                            {{ s.setor }}
                        </option>

                    {% endfor %}

                </select>

                <a
                    href="{% url 'add_setor' %}"
                    class="btn btn-info mt-2"
                >
                    ADICIONAR SETOR
                </a>

            </div>

        </div>

        <div class="form-row">

            <div class="form-group col-md-4">

                <label for="empresa">Empresa:</label>

                <select
                    id="empresa"
                    name="empresa"
                    class="form-control"
                    required
                >

                    <option value="">
                        Selecione a empresa
                    </option>

                    {% for e in empresas %}

                        <option
                            value="{{ e.id }}"
                            {% if e.id == ramais.empresa_ramais_id %}selected{% endif %}
                        >
                            {{ e.nome_emp }}
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-success"
        >
            SALVAR
        </button>

        <a
            href="{% url 'lista_ramais' %}"
            class="btn btn-danger"
        >
            CANCELAR
        </a>

    </form>

</section>

{% endblock %}
