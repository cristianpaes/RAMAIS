{% extends "parciais/base.html" %}

{% block content %}

{% load static %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-6 col-lg-4">

            <div class="bgcolor">

                <div class="card-body">

                    <div class="text-center mb-4">

                        <h4>
                            <img
                                src="{% static 'img/login.png' %}"
                                width="30"
                                height="30"
                                alt="Login"
                            >
                            Login
                        </h4>

                    </div>

                    <form
                        method="POST"
                        action="{% url 'submit_login' %}"
                        class="form"
                    >

                        {% csrf_token %}

                        <div class="form-group">

                            <label for="username">
                                Usuário:
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                autocomplete="username"
                                required
                                autofocus
                            >

                        </div>

                        <div class="form-group">

                            <label for="password">
                                Senha:
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                        <div class="text-center mt-4">

                            <button
                                class="btn btn-success"
                                type="submit"
                            >
                                ENTRAR
                            </button>

                            <a
                                href="{% url 'lista_ramais' %}"
                                class="btn btn-secondary"
                            >
                                CANCELAR
                            </a>

                        </div>

                    </form>

                    {% if messages %}

                        <div class="mt-3">

                            {% for message in messages %}

                                <div
                                    class="alert alert-danger"
                                    role="alert"
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
